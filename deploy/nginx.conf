# /etc/nginx/conf.d/invoice-keeper.conf — HTTPS in front of the app on 127.0.0.1:18081.
# Certificate: certbot certonly --webroot -w /var/www/acme -d keeper.example.ru (renewed by certbot.timer).
# The app needs PUBLIC_BASE_URL=https://keeper.example.ru and TRUSTED_PROXIES=127.0.0.1 in .env.
limit_req_zone $binary_remote_addr zone=keeper_login:1m rate=5r/m;

server {
    listen 80;
    server_name keeper.example.ru;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name keeper.example.ru;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/keeper.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keeper.example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 6m;   # receipts are up to 5 MB

    location = /api/v1/auth/login {
        limit_req zone=keeper_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18081;
        include /etc/nginx/snippets/invoice-keeper-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:18081;
        include /etc/nginx/snippets/invoice-keeper-proxy.conf;
    }
}

