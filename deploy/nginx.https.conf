limit_req_zone $binary_remote_addr zone=keeper_ip:1m rate=10r/s;
limit_req_zone $server_name zone=keeper_total:1m rate=30r/s;
limit_req_zone $binary_remote_addr zone=keeper_login:1m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=keeper_conn:1m;
server {
    listen 80;
    server_name __DOMAIN__;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/invoice-keeper-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://__DOMAIN__$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;
    server_tokens off;
    ssl_certificate /opt/invoice-keeper/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /opt/invoice-keeper/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KEEPERSSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 6m;
    client_body_timeout 30s;
    send_timeout 30s;
    access_log off;
    error_log /var/log/invoice-keeper/nginx-error.log warn;
    limit_req zone=keeper_total burst=50 nodelay;
    limit_req zone=keeper_ip burst=30 nodelay;
    limit_req_status 429;
    limit_req_log_level notice;
    limit_conn keeper_conn 20;
    location = /api/v1/auth/login {
        limit_req zone=keeper_total burst=20 nodelay;
        limit_req zone=keeper_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18081;
        include /opt/invoice-keeper/config/nginx.proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:18081;
        include /opt/invoice-keeper/config/nginx.proxy.conf;
    }
}
