name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go — vet и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Код из docs/openapi.json не устарел (oapi-codegen)
        run: go generate ./internal/api && git diff --exit-code -- internal/api
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Сборка бинарника
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/invoice-keeper ./cmd/invoice-keeper
      - name: Запуск по README с демоданными
        run: |
          cd "$(mktemp -d)"
          /tmp/invoice-keeper bootstrap --demo
          /tmp/invoice-keeper serve --port 18080 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/v1/payment-occurrences)" = 401

  security:
    name: Безопасность — уязвимости и статический анализ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck — известные уязвимости в Go и зависимостях
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: gosec — статический анализ (G104 — необработанные ошибки Close/Rollback — исключён)
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -exclude-generated -exclude=G104 ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit — уязвимости в зависимостях панели
        working-directory: frontend
        run: npm audit --audit-level=high

  frontend:
    name: Панель — типы, переводы, сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run i18n
      - run: npm run build

  container:
    name: Docker — запуск по инструкции
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t invoice-keeper:ci .
      - name: Bootstrap и запуск без root
        run: |
          docker volume create keeper-ci
          docker run --rm -v keeper-ci:/data invoice-keeper:ci invoice-keeper bootstrap --demo
          docker run -d --name keeper-ci --memory=256m --cpus=0.5 --read-only --tmpfs /tmp:rw,size=16m --cap-drop=ALL --security-opt=no-new-privileges -p 127.0.0.1:18081:8000 -v keeper-ci:/data invoice-keeper:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18081/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18081/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/api/v1/payment-occurrences)" = 401
      - if: always()
        run: docker logs keeper-ci || true
